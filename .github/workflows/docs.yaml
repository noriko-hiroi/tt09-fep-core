name: docs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Typst
        uses: typst-community/setup-typst@v3
        with:
          typst-version: 'v0.11.0'

      - name: Build docs
        uses: TinyTapeout/tt-gds-action/docs@tt09
