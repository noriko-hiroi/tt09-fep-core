# Tiny Tapeout project information
project:
  title:        "FEP Core AI Chip"      # FEP Core AI Chip
  author:       "Noriko F Hiroi"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Free Energy Principle prediction error minimization core"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     10000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_fep_core"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# User information / Documentation
documentation:
  by_the_same_author: ""
  how_it_works: |
    Calculates prediction error (e = x - mu) and updates internal state mu using gradient descent.
    Includes an adaptive suppression gate (alert_gate) to reduce learning rate during high-variance input.

  how_to_test: |
    Apply 8-bit Q1.14 input values to ui_in and observe internal state mu on uo_out.


# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
    - "x_in bit 8 (Q1.14)"
    - "x_in bit 9"
    - "x_in bit 10"
    - "x_in bit 11"
    - "x_in bit 12"
    - "x_in bit 13"
    - "x_in bit 14"
    - "x_in bit 15 (Sign)"

  # Outputs
    - "mu_out bit 8 (Q1.14)"
    - "mu_out bit 9"
    - "mu_out bit 10"
    - "mu_out bit 11"
    - "mu_out bit 12"
    - "mu_out bit 13"
    - "mu_out bit 14"
    - "mu_out bit 15 (Sign)"

  # Bidirectional pins
    - "error_out bit 8"
    - "error_out bit 9"
    - "error_out bit 10"
    - "error_out bit 11"
    - "error_out bit 12"
    - "error_out bit 13"
    - "error_out bit 14"
    - "alert_gate flag"

# Do not change!
yaml_version: 6
